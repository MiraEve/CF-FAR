name: secret-guard

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fail if signing material or binaries are committed
        run: |
          set -e
          bad=0
          for p in $(git ls-files | grep -Ei '\.(keystore|jks|p12|pfx)$' || true); do
            echo "::error file=$p::signing material must never be committed"
            bad=1
          done
          for p in $(git ls-files | grep -E 'app/assets/cloudflared$' || true); do
            echo "::error file=$p::third-party binary must be fetched at build time"
            bad=1
          done
          exit $bad

      - name: Fail if a GitHub token pattern is present
        run: |
          set -e
          if git grep -nE 'github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{30,}' -- . ; then
            echo "::error::a GitHub token appears to be committed"
            exit 1
          fi
          echo "no token patterns found"

      - name: Sanity check project layout
        run: |
          test -f app/AndroidManifest.xml
          test -d app/src/com/mil/cftunnel
          test -f LICENSE
          test -f README.md
          echo "layout ok"
